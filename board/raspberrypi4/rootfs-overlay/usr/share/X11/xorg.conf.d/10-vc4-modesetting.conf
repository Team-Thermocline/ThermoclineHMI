# Force modesetting to use VC4 DRM card1 (DSI-1 = 7" panel, 800x480).
# Provide an explicit Screen so X has a mode even if connector probe is flaky.
Section "Device"
    Identifier "VC4"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card1"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "VC4"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "800x480"
    EndSubSection
EndSection
