# Thermocline HMI image: webkiosk showing the sender from team-thermocline.github.io
# Build: run scripts/pack-web.sh first, then:
#   rpi-image-gen build -S ./thermocline-kiosk -c config/thermocline.yaml

include:
  file: trixie-minbase-ab.yaml

# Build for Pi 4 (kernel8.img, bcm2711).
device:
  layer: rpi4

image:
  system_part_size: 1500M
  name: thermocline-hmi

layer:
  app: thermocline-kiosk
  splash: rpi-splash-screen

# Packed web is at ${@SRCROOT}/web-root (created by scripts/pack-web.sh)
thermocline:
  srcroot: ${@SRCROOT}

kiosk:
  url: "http://localhost:8080/#sender"

# Boot splash
splash:
  image_path: ${@SRCROOT}/splash.tga
