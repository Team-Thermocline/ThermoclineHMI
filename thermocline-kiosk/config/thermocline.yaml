# Thermocline HMI image: kiosk running thermocline-electron (Sender UI) under Cage.
# Build: run ./build.sh (builds Electron for Pi, copies to electron-dist, then builds image).

include:
  file: trixie-minbase-ab.yaml

# Build for Pi 4 (kernel8.img, bcm2711).
device:
  layer: rpi4

image:
  system_part_size: 1500M
  name: thermocline-hmi

layer:
  app: thermocline-kiosk
  # splash: rpi-splash-screen  # disabled: hook exits then mmdebstrap gets "received eof on socket"

# SRCROOT is the thermocline-kiosk dir (-S path). electron-dist/ must exist (build.sh copies from thermocline-electron dist).
thermocline:
  srcroot: ${@SRCROOT}

# Boot splash (disabled). Uncomment layer.splash and this block to re-enable.
# splash:
#   image_path: ${@SRCROOT}/splash.tga
#   skip_image_checks: y
