# METABEGIN
# X-Env-Layer-Name: thermocline-kiosk
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: Thermocline HMI kiosk; runs the packaged thermocline-electron app under Cage (Wayland).
# X-Env-Layer-Requires: rpi-user-credentials,systemd-net-min
#
# X-Env-VarPrefix: thermocline
#
# X-Env-Var-srcroot: ${@SRCROOT}
# X-Env-Var-srcroot-Desc: Source root (-S path) for packed web and templates
# X-Env-Var-srcroot-Required: n
# X-Env-Var-srcroot-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - cage
    - dbus
    - file
    - coreutils
    - wvkbd
    # Electron on Linux (minimal deps for headless/DRM)
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libatk1.0-0
    - libgbm1
  customize-hooks:
    - |
      export KIOSK_USER="$IGconf_device_user1"
      SRCROOT="$IGconf_thermocline_srcroot"
      ELECTRON_SRC="${SRCROOT}/electron-dist"
      ELECTRON_DEST="$1/opt/thermocline-electron"
      mkdir -p "$ELECTRON_DEST"
      if [ -d "$ELECTRON_SRC" ] && [ -n "$(ls -A "$ELECTRON_SRC" 2>/dev/null)" ]; then
        cp -a "$ELECTRON_SRC"/* "$ELECTRON_DEST/"
      fi
      install -m 755 "$SRCROOT/scripts/thermocline-kiosk-launch.sh" "$1/usr/local/bin/thermocline-kiosk-launch"
      install -m 644 "$SRCROOT/pam.d/cage" "$1/etc/pam.d/cage"
      if [ -z "${KIOSK_USER:-}" ]; then
        echo "thermocline-kiosk layer: KIOSK_USER is empty (set IGconf_device_user1 / export KIOSK_USER)" >&2
        exit 1
      fi
      envsubst '$KIOSK_USER' < "$SRCROOT/kiosk.service.tpl" > "$1/etc/systemd/system/kiosk.service"
      if grep -qF '$KIOSK_USER' "$1/etc/systemd/system/kiosk.service"; then
        echo "thermocline-kiosk layer: kiosk.service still contains \$KIOSK_USER" >&2
        exit 1
      fi
    - $BDEBSTRAP_HOOKS/enable-units "$1" kiosk
