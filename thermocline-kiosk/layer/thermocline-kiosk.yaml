# METABEGIN
# X-Env-Layer-Name: thermocline-kiosk
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: Thermocline HMI kiosk; runs the packaged thermocline-electron app under Cage (Wayland).
# X-Env-Layer-Requires: rpi-user-credentials,systemd-net-min
#
# X-Env-VarPrefix: thermocline
#
# X-Env-Var-srcroot: ${@SRCROOT}
# X-Env-Var-srcroot-Desc: Source root (-S path) for packed web and templates
# X-Env-Var-srcroot-Required: n
# X-Env-Var-srcroot-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - cage
    - dbus
    - rpi-splash-screen-support
    - file
    - coreutils
    # Electron on Linux (minimal deps for headless/DRM)
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libatk1.0-0
    - libgbm1
  customize-hooks:
    # Splash: copy image into chroot, run configure-splash, and ensure cmdline has quiet splash
    - |
      CHROOT="$(printf '%s' "$1" | tr -d '\n\r')"
      SPLASH="${IGconf_thermocline_srcroot:-}/splash.tga"
      if [ -f "$SPLASH" ]; then
        mkdir -p "$CHROOT/tmp" "$CHROOT/opt"
        cp "$SPLASH" "$CHROOT/tmp/splash-screen-source.tga"
        cp "$SPLASH" "$CHROOT/opt/thermocline-splash.tga"
        chroot "$CHROOT" /usr/bin/configure-splash /tmp/splash-screen-source.tga --skip-image-checks --no-cmdline
        rm -f "$CHROOT/tmp/splash-screen-source.tga"
        chroot "$CHROOT" update-initramfs -u -k all 2>/dev/null || true
        for cmd in "$CHROOT/boot/firmware/cmdline.txt" "$CHROOT/boot/cmdline.txt"; do
          if [ -f "$cmd" ]; then
            line="$(cat "$cmd")"
            echo "$line" | grep -q '\bquiet\b' || line="$line quiet"
            echo "$line" | grep -q '\bsplash\b' || line="$line splash"
            printf '%s\n' "$line" > "$cmd"
            break
          fi
        done
      fi
    - |
      export KIOSK_USER="$IGconf_device_user1"
      export KIOSK_RUNDIR="/home/$IGconf_device_user1"
      SRCROOT="$IGconf_thermocline_srcroot"
      ELECTRON_SRC="${SRCROOT}/electron-dist"
      ELECTRON_DEST="$1/opt/thermocline-electron"
      mkdir -p "$ELECTRON_DEST"
      if [ -d "$ELECTRON_SRC" ] && [ -n "$(ls -A "$ELECTRON_SRC" 2>/dev/null)" ]; then
        cp -a "$ELECTRON_SRC"/* "$ELECTRON_DEST/"
      fi
      envsubst < "$SRCROOT/kiosk.service.tpl" > "$1/etc/systemd/system/kiosk.service"
    - $BDEBSTRAP_HOOKS/enable-units "$1" kiosk
    # Enable second serial port (ttyAMA1) for HMI/controller; Electron app uses it, console stays on first UART
    - |
      for cfg in "$1/boot/firmware/config.txt" "$1/boot/config.txt"; do
        [ -f "$cfg" ] && { grep -q '^enable_uart=' "$cfg" || echo "enable_uart=1" >> "$cfg"; grep -q 'dtoverlay=uart2' "$cfg" || { echo "# Thermocline HMI: second UART for controller" >> "$cfg"; echo "dtoverlay=uart2" >> "$cfg"; }; break; }
      done
    # Allow root login with no password (serial/console debugging)
    - '[ -f "$1/etc/shadow" ] && sed -i "s/^root:[^:]*/root:/" "$1/etc/shadow" || true'
    # Remove apt lock/partial so genimage can read the filesystem when checking context
    - rm -f "$1/var/lib/apt/lists/lock" 2>/dev/null || true; rm -rf "$1/var/lib/apt/lists/partial" 2>/dev/null || true
