# METABEGIN
# X-Env-Layer-Name: thermocline-splash
# X-Env-Layer-Category: device
# X-Env-Layer-Desc: Fullscreen splash; same as rpi-splash-screen but configure-splash gets image path first (upstream hook argv order is wrong).
# X-Env-Layer-Version: 1.0.0
#
# X-Env-VarPrefix: splash
#
# X-Env-Var-image_path: ${DIRECTORY}/default-splash.tga
# X-Env-Var-image_path-Desc: Path to the splash screen image file (24-bit TGA). Empty skips install.
# X-Env-Var-image_path-Required: n
# X-Env-Var-image_path-Valid: string-or-empty
# X-Env-Var-image_path-Set: y
#
# X-Env-Var-skip_image_checks: n
# X-Env-Var-skip_image_checks-Desc: If y, skip TGA validation (testing only).
# X-Env-Var-skip_image_checks-Required: n
# X-Env-Var-skip_image_checks-Valid: bool
# X-Env-Var-skip_image_checks-Set: y
#
# X-Env-Var-update_cmdline: y
# X-Env-Var-update_cmdline-Desc: If y, configure-splash edits cmdline.txt; use n with a custom cmdline.
# X-Env-Var-update_cmdline-Required: n
# X-Env-Var-update_cmdline-Valid: bool
# X-Env-Var-update_cmdline-Set: y
# METAEND
#
# configure-splash uses IMAGE_PATH="$1" after flag parsing; image must be first argument:
# https://github.com/raspberrypi/rpi-splash-screen-support/blob/master/configure-splash
---
mmdebstrap:
  packages:
    - rpi-splash-screen-support
    - initramfs-tools
    - file
  customize-hooks:
    - |-
      set -eu

      if [ -z "${IGconf_splash_image_path:-}" ]; then
        echo "No splash screen image specified, skipping installation" >&2
        exit 0
      fi

      SPLASH_IMAGE="$IGconf_splash_image_path"
      if [ ! -f "$SPLASH_IMAGE" ]; then
        echo "Error: Splash screen image not found: $SPLASH_IMAGE" >&2
        exit 1
      fi

      TEMP_IMAGE="/tmp/splash-screen-source.tga"
      cp "$SPLASH_IMAGE" "$1$TEMP_IMAGE"

      echo "Configuring splash screen from $SPLASH_IMAGE" >&2

      if [ "$IGconf_splash_skip_image_checks" = "y" ] && [ "$IGconf_splash_update_cmdline" != "y" ]; then
        chroot "$1" /usr/bin/configure-splash "$TEMP_IMAGE" --skip-image-checks --no-cmdline
      elif [ "$IGconf_splash_skip_image_checks" = "y" ]; then
        chroot "$1" /usr/bin/configure-splash "$TEMP_IMAGE" --skip-image-checks
      elif [ "$IGconf_splash_update_cmdline" != "y" ]; then
        chroot "$1" /usr/bin/configure-splash "$TEMP_IMAGE" --no-cmdline
      else
        chroot "$1" /usr/bin/configure-splash "$TEMP_IMAGE"
      fi

      rm -f "$1$TEMP_IMAGE"

      echo "Splash screen configured successfully" >&2
